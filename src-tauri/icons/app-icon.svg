<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Idea Workspace</title>
  <desc id="desc">Three overlapping cards representing controlled context sharing.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262d45"/>
      <stop offset="1" stop-color="#111622"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#05070d" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#background)"/>
  <g fill="#1a2030" stroke-width="18" filter="url(#shadow)">
    <rect x="112" y="116" width="224" height="156" rx="34" stroke="#f7f8ff"/>
    <rect x="176" y="192" width="224" height="156" rx="34" stroke="#aeb8ff"/>
    <rect x="136" y="272" width="224" height="132" rx="34" stroke="#74d6bb"/>
  </g>
  <circle cx="256" cy="260" r="22" fill="#f7f8ff"/>
</svg>
